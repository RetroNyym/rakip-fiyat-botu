# Her push / PR'de test paketi otomatik koşar.
# Ağ erişimi gerekmez: testler yerel (127.0.0.1) HTTP sunucusu kurar.
name: testler

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      # v4/v5 Node 20 üzerinde çalışıyordu ve GitHub artık uyarı veriyor.
      # v6 sürümleri Node 24 kullanır.
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt Pillow matplotlib pytest

      - name: Birim + entegrasyon testleri (unittest)
        run: python -m unittest discover -v

      - name: Çapraz doğrulama (pytest)
        run: python -m pytest -q
